name: Check Phaser prototype
on:
  push:
    branches: [phaser]
  pull_request:
    paths: ['phaser/**', '.github/workflows/phaser.yml']
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phaser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: phaser/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - run: npm run test:browser
        env:
          REALMPACK_BUILT: 1
      - uses: actions/upload-artifact@v4
        with:
          name: realmpack-phaser-preview
          path: phaser/dist
