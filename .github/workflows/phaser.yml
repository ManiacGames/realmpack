name: Check Phaser prototype
on:
  push:
    branches: [phaser]
  pull_request:
    paths: ['phaser/**', '.github/workflows/phaser.yml']
permissions:
  contents: read
concurrency:
  group: phaser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    name: Check ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [source, packaged]
    defaults:
      run:
        working-directory: phaser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: phaser/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        if: matrix.target == 'packaged'
      - run: npm run test:launch
        if: matrix.target == 'packaged'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          REALMPACK_BUILT: ${{ matrix.target == 'packaged' && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'packaged'
        with:
          name: realmpack-phaser-preview
          path: phaser/dist
