name: Deploy RealmPack
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check release notes
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/check-changelog.cjs
      - name: Check JavaScript and game behavior
        run: |
          for file in game/*.js; do node --check "$file"; done
          node game/tests/test-stacks-adjacency.cjs
          node game/tests/test-attribute-rings.cjs
          node game/tests/test-consumable-rework.cjs
          node game/tests/test-compendium-availability.cjs
          node game/tests/test-combat-geometry.cjs
          node game/tests/test-event-art.cjs
          node game/tests/test-battle-floors.cjs
          node game/tests/test-shop-layout.cjs
          node game/tests/test-shop-specialists.cjs
          node game/tests/test-inventory-interaction.cjs
          node game/tests/test-stash-capacity.cjs
          node game/tests/test-healing-consumables.cjs
          node game/tests/test-local-haste.cjs
          node game/tests/test-item-progression.cjs
          node game/tests/test-class-reworks.cjs
          node game/tests/test-event-trades.cjs
          node game/tests/test-enchantments.cjs
          node game/tests/test-provisions.cjs
          node game/tests/test-ut-st-identities.cjs
          node game/tests/test-dagger-update.cjs
          node game/tests/test-dungeon-difficulty.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: game
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
