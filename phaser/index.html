<section id="menu-options" role="tabpanel" aria-labelledby="tab-options" hidden><div class="realm-menu-links"><button id="sound-button">Sound effects &amp; volume</button><button id="text-button">Larger text</button><button id="hints-button" aria-pressed="true">Gameplay hints: On</button><button id="hints-reset">Show hints again</button></div><label>Effects quality<select id="quality-choice"></select></label></section>

<div class="dialog-actions menu-return"><button data-close>Return to game · Esc</button></div></dialog>
<dialog id="campaign-dialog" aria-labelledby="campaign-title"><div class="campaign-heading"><div><h1 id="campaign-title"></h1><p id="campaign-description"></p><span id="campaign-wallet"></span></div><button id="campaign-close" aria-label="Close this view">✕</button></div><div id="campaign-content"></div><div class="campaign-footer"><button id="campaign-pack" title="Arrange your gear without advancing this encounter">Inventory</button><div id="campaign-actions"></div></div></dialog>
<dialog id="item-details" aria-labelledby="item-title"><h1 id="item-title">Item details</h1><div id="item-copy"></div><button data-close>Close</button></dialog>

<dialog id="result" aria-labelledby="result-title"><h1 id="result-title"></h1><p id="result-copy"></p><div id="loot"></div><button id="retry">Prepare another bout</button></dialog>
