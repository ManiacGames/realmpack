<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RealmPack · Phaser edition</title><link rel="icon" href="../game/assets/vault-chest-unlocker.png"><link rel="stylesheet" href="style.css?v=0.2.0"><link rel="stylesheet" href="campaign.css?v=0.2.0"></head>
<body>
<header><div class="brand"><img src="../game/assets/vault-chest-unlocker.png" alt="">RealmPack <small>PHASER 0.2.0 ⚡⚡</small></div><nav aria-label="Run controls"><button id="fight">Begin battle</button><button id="speed">1×</button><button id="menu">Menu</button></nav></header>
<main id="game" aria-label="RealmPack combat and inventory canvas"></main>
<footer><span id="notice" role="status">Your descent awaits.</span><span id="run-progress"></span><span class="desktop-hints">Drag items · R rotate · S stash · F details · Esc menu</span></footer>
<div class="mobile-tabs" role="tablist" aria-label="Inventory view"><button data-view="pack" role="tab" aria-selected="true">Backpack</button><button data-view="stash" role="tab" aria-selected="false">Stash</button></div>
<div class="item-actions" aria-label="Selected item actions"><button id="rotate">Rotate · R</button><button id="stash-item">Stash · S</button><button id="details">Full details · F</button><button id="discard">Discard · D</button></div>
<dialog id="settings" aria-labelledby="settings-title"><h1 id="settings-title">Run menu</h1><div class="realm-menu-links"><button id="map-button">Run map</button><button id="catalogue-button">Item catalogue · I</button><button id="bestiary-button">Encounter bestiary · E</button><button id="info-button">Class &amp; encounter</button><button id="journal-button">Combat journal</button><button id="sound-button">Sound effects</button><button id="help-button">How to play</button><button id="text-button">Larger text</button></div><label>Effects quality<select id="quality-choice"></select></label><p id="save-status"></p><div class="dialog-actions"><button id="export-run">Export run</button><button id="import-run">Import run</button><input type="file" id="import-file" accept="application/json,.json" hidden></div><label>Game mode<select id="game-mode"><option value="campaign">Dungeon run</option><option value="lab">Combat lab</option></select></label><div id="lab-settings"><label>Class<select id="class-choice"></select></label><label>Dungeon<select id="dungeon-choice"></select></label></div><div class="dialog-actions"><button id="new-run">Choose adventurer</button><button data-close>Return to game</button></div></dialog>
<dialog id="campaign-dialog" aria-labelledby="campaign-title"><div class="campaign-heading"><div><h1 id="campaign-title"></h1><p id="campaign-description"></p><span id="campaign-wallet"></span></div><button id="campaign-close" aria-label="Close this view">✕</button></div><div id="campaign-content"></div><div class="campaign-footer"><div id="campaign-actions"></div><button id="campaign-pack">Manage backpack</button></div></dialog>
<dialog id="item-details" aria-labelledby="item-title"><h1 id="item-title">Item details</h1><div id="item-copy"></div><button data-close>Close</button></dialog>
<dialog id="discard-confirm" aria-labelledby="discard-title"><h1 id="discard-title">Discard this item?</h1><p id="discard-copy"></p><div class="dialog-actions"><button data-close>Keep item</button><button id="confirm-discard">Discard</button></div></dialog>
<dialog id="result" aria-labelledby="result-title"><h1 id="result-title"></h1><p id="result-copy"></p><div id="loot"></div><button id="retry">Prepare another bout</button></dialog>
<div id="load-error" role="alert" hidden></div>
